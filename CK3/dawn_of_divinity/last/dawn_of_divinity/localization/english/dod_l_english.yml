l_english:
 get_roguelike_trait_decision_tooltip:0 "Take the sign of the Dawn and become a Dawnbearer: achievements will bring power drafts — three gifts to choose from, repeats stack. Death ends the run; the heir will start anew."
 get_roguelike_trait_decision:0 "Embrace the Dawn of Divinity"
 get_roguelike_trait_decision_desc:0 "The dawn whispers to those who loom large. Take the sign of the Dawn: great deeds of prestige, piety and lived years will grant you powers. Death ends your run — and begins the next bearer's."
 get_roguelike_trait_decision_confirm:0 "The dawn accepts you. Begin the path."
 dod_debug_draft_decision:0 "DEBUG: next power now"
 dod_debug_draft_decision_desc:0 "Debug decision for testing the power draft."
 dod_debug_draft_decision_confirm:0 "Grant a power."
 dod_debug_draft_decision_tooltip:0 "Debug: immediately grants a power draft (pick 1 of 3; with the Blessing for a deity)."
 divinity_roguelike_user:0 "Dawnbearer"
 divinity_roguelike_user_desc:0 "One who has accepted the power of the Dawn. While they live, the power grows; with death, the run ends."
 divinity_roguelike_user_effects:0 "Unlocks the Dawn power drafts."
 trait_divinity_roguelike_user:0 "Dawnbearer"
 trait_divinity_roguelike_user_desc:0 "One who has accepted the power of the Dawn. While they live, the power grows; with death, the run ends."
 trait_divinity_roguelike_user_character_desc:0 "[CHARACTER.GetFirstNameNoTooltip] has taken the sign of the Dawn: for great deeds, the daybreak grants powers."
 dod_draft_event_title:0 "Power of the Dawn"
 dod_draft_event_desc:0 "The threshold is crossed, and the dawn burns in your blood. It offers three gifts, yet accepts a single choice. A gift may repeat itself: repeated powers stack. A deity of the Dawn is also offered the Blessing."
