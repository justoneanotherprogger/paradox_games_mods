 dod_blessing_of_dawn:0 "Blessing of the Dawn"
 dod_blessing_of_dawn_desc:0 "A deity's gift: prestige, piety and taxes. Repeated gifts stack."
 dod_blessing_option_tt:0 "Blessing of the Dawn: prestige +0.1/month, piety +0.1/month, taxes +1%. Choosing it again stacks. For deities of the Dawn only."
 dod_apotheosis_decision:0 "Apotheosis"
 dod_apotheosis_decision_desc:0 "Eight powers of the Dawn beat as one — your mortal shell no longer holds. Take the final gift: become a deity of the dawn and gain power over life and death."
 dod_apotheosis_decision_tooltip:0 "Unlocked when all 8 distinct Dawn powers are collected. Grants the permanent Divine Aura (+1 to all attributes, +0.5 monthly prestige and piety), unlocks the «Divine Smite» and «Healing Touch» interactions (100-year cooldown) and adds the Blessing of the Dawn to every draft."
 dod_apotheosis_decision_confirm:0 "Become a deity."
 dod_apotheosis:0 "Divine Aura"
 dod_apotheosis_desc:0 "Reborn in the dawn: +1 to all attributes, +0.5 monthly prestige and piety."
 dod_apotheosis_event_title:0 "Apotheosis"
 dod_apotheosis_event_desc:0 "The light no longer retreats — it pours in. Your mortal features blur like coastlines under a tide. You are a deity of the Dawn, and your will now weighs upon the world."
 dod_apotheosis_option:0 "The light has accepted me"
 dod_apotheosis_option_tt:0 "Divine Aura granted. «Divine Smite» and «Healing Touch» are available in the character interactions menu (right-click a character)."
 dod_smite_interaction:0 "Divine Smite"
 dod_smite_interaction_desc:0 "The will of a god is the will of the world. The target dies without a trace and without witnesses. Cost: 500 piety. Cooldown: 100 years."
 death_dod_smite:0 "was struck down by the wrath of the Dawn"
 dod_heal_interaction:0 "Healing Touch"
 dod_heal_interaction_desc:0 "A deity's touch banishes any ailment and closes wounds, leaving Divine Grace (health +1) for 10 years. Cost: 250 piety. Cooldown: 100 years."
 dod_healing_touch:0 "Divine Grace"
 dod_healing_touch_desc:0 "Touched by the light of the Dawn: health +1 for 10 years."
 dod_debug_deity_decision:0 "DEBUG: become a deity now"
 dod_debug_deity_decision_desc:0 "Debug: instantly grants Apotheosis — the Divine Aura and the Smite/Heal interactions, without collecting all powers."
 dod_debug_deity_decision_confirm:0 "Become a deity."
 dod_debug_deity_decision_tooltip:0 "Debug: instantly grants the Divine Aura and the «Divine Smite» / «Healing Touch» interactions, without collecting all 8 powers."
