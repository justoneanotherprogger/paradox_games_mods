 dod_blessing_option:0 "#M Принять благословение #!"
 dod_blessing_of_dawn:0 "Благословение Рассвета"
 dod_blessing_of_dawn_desc:0 "Дар божества: престиж, благочестие и налоги. Повторные дары складываются."
 dod_blessing_option_tt:0 "Благословение Рассвета: престиж +0.1/мес, благочестие +0.1/мес, налоги +1%. Повторный выбор складывается. Доступно только божеству Рассвета."
 dod_apotheosis_decision:0 "Обожествление"
 dod_apotheosis_decision_desc:0 "Восемь сил Рассвета пульсируют в едином ритме — тело больше не держит смертного. Прими последний дар: стань божеством зари и обрети силу над жизнью и смертью."
 dod_apotheosis_decision_tooltip:0 "Открывается, когда собраны все 8 различных сил Рассвета. Даёт перманентную Ауру божества (+1 ко всем способностям, +0.5 престижа и благочестия в месяц), открывает интеракции «Кара небес» и «Исцеляющее касание» (кулдаун 100 лет) и добавляет Благословение Рассвета в каждый драфт."
 dod_apotheosis_decision_confirm:0 "Стать божеством."
 dod_apotheosis:0 "Аура божества"
 dod_apotheosis_desc:0 "Перерождённый в зари: +1 ко всем способностям, +0.5 престижа и благочестия в месяц."
 dod_apotheosis_event_title:0 "Вознесение"
 dod_apotheosis_event_desc:0 "Свет больше не отступает — он вливается. Черты смертного стираются, как берега под приливом. Ты — божество Рассвета, и воля твоя теперь тяжесть для мира."
 dod_apotheosis_option:0 "Свет принял меня"
 dod_apotheosis_option_tt:0 "Аура божества выдана. «Кара небес» и «Исцеляющее касание» — в меню взаимодействия с персонажами (правый клик по персонажу)."
 dod_smite_interaction:0 "Кара небес"
 dod_smite_interaction_desc:0 "Воля божества — воля мира. Цель умирает без следа и без свидетелей. Стоимость: 500 благочестия. Кулдаун: 100 лет."
 death_dod_smite:0 "был(а) поражён(а) гневом Рассвета"
 dod_heal_interaction:0 "Исцеляющее касание"
 dod_heal_interaction_desc:0 "Касание божества изгоняет любую хворь и затягивает раны, оставляя Благодать (здоровье +1) на 10 лет. Стоимость: 250 благочестия. Кулдаун: 100 лет."
 dod_healing_touch:0 "Благодать божества"
 dod_healing_touch_desc:0 "Коснулся света Рассвета: здоровье +1 на 10 лет."
 dod_debug_deity_decision:0 "DEBUG: стать божеством сейчас"
 dod_debug_deity_decision_desc:0 "Отладка: мгновенно выдаёт Обожествление — ауру божества и интеракции Кары/Исцеления, без сбора всех сил."
 dod_debug_deity_decision_confirm:0 "Стать божеством."
 dod_debug_deity_decision_tooltip:0 "Отладка: мгновенно даёт Ауру божества и интеракции «Кара небес» и «Исцеляющее касание», без сбора всех 8 сил."
