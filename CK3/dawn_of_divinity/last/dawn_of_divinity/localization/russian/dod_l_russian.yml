l_russian:
 get_roguelike_trait_decision:0 "Принять Силу Рассвета"
 get_roguelike_trait_decision_desc:0 "Заря шепчет тому, кто достаточно велик. Прими знак Рассвета: за великие деяния престижем, благочестием и прожитыми годами ты будешь получать силы. Смерть завершит твой путь — и начнёт путь нового носителя."
 get_roguelike_trait_decision_confirm:0 "Заря принимает тебя. Начать путь."
 get_roguelike_trait_decision_tooltip:0 "Прими знак Рассвета и стань Носителем: за достижения придут драфты сил — три дара на выбор, повторы складываются. Путь завершает смерть; наследник начнёт заново."
 dod_debug_draft_decision:0 "DEBUG: следующая сила сейчас"
 dod_debug_draft_decision_desc:0 "Отладочное решение для тестирования драфта сил."
 dod_debug_draft_decision_confirm:0 "Выдать силу."
 dod_debug_draft_decision_tooltip:0 "Отладка: немедленно выдаёт драфт сил (выбор 1 из 3, у божества — с Благословением)."
 divinity_roguelike_user:0 "Носитель Рассвета"
 divinity_roguelike_user_desc:0 "Тот, кто принял силу Рассвета. Пока он жив — сила растёт; со смертью путь завершается."
 divinity_roguelike_user_effects:0 "Открывает драфты сил Рассвета."
 trait_divinity_roguelike_user:0 "Носитель Рассвета"
 trait_divinity_roguelike_user_desc:0 "Тот, кто принял силу Рассвета. Пока он жив — сила растёт; со смертью путь завершается."
 trait_divinity_roguelike_user_character_desc:0 "[CHARACTER.GetFirstNameNoTooltip] принял знак Рассвета: за великие деяния заря дарует силы."
 dod_draft_event_title:0 "Рассветная сила"
 dod_draft_event_desc:0 "Порог пройден — и заря разгорается в твоей крови. Сила предлагает три дара, но примет лишь один выбор. Дар может повториться: повторённые силы складываются. Божеству Рассвета предлагается и Благословение."
